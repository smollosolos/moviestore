{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class = "p-3">
    <div class = "container">
        <div class="row mt-3">
            <div class=""col-md-12 mx-auto mb-3">
                <h2> Top Purchases</h2>
                <hr />
                <form method = "GET" actions="">
                    <div class = "row g-3 align-items-center">
                        <div class="col-auto">
                            <label for = "limit"> List Size (Limit): </label>
                        </div>
                        <div class=""col-auto">
                            <input type = "number" id = "limit" name = "limit" value = "{{ list_size}}" placeholder = "Leave blank for all users">
                        </div>
                        <div class=""col-auto">
                            <button type = "Submit"> Filter </button>
                        </div>
                    </div>
                </form>

                <div class=""card shadow-sm">
                    <div class=""card-body">
                        <table class=""table table-stripped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th> Users </th>
                                    <th> Purchase Count </th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for user in users %}
                                <tr>
                                    <td> {{ user.username }}</td>
                                    <td> {{ user.purchase_count }}</td>
                                </tr>
                                {% empty %}
                                <tr>
                                    <td> colspan = "2"> No Users Found</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
